# BEGIN_KITTY_THEME
include theme.conf
# END_KITTY_THEME

# Optik & Transparenz
hide_window_decorations yes
window_padding_width 12
background_opacity 0.85

# Schrift & Ligaturen (Schriftname ggf. anpassen)
font_family      ComicShannsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never
