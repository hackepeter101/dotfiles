background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.018
    contrast = 0.92
    brightness = 0.62
    vibrancy = 0.12
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 240, 44
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(228, 17, 72)
    inner_color = rgb(5, 2, 9)
    font_color = rgb(196, 237, 233)
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    hide_input = false
    position = 0, -65
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(228, 17, 72)
    font_size = 78
    font_family = Maple Mono
    position = 0, 165
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgb(196, 237, 233)
    font_size = 16
    font_family = Maple Mono
    position = 0, 95
    halign = center
    valign = center
}

label {
    monitor =
    text = UwU
    color = rgb(196, 237, 233)
    font_size = 20
    font_family = Maple Mono
    position = 0, 25
    halign = center
    valign = center
}